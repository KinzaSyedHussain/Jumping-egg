<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eggo game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game">

        <div id="egg" class="hidden"></div>

        <div id="obstacle"></div>

        <div id="menu">
            <h2>Take your EGG!</h2>
            <div class="characters">
               <div class="egg-container">
                   <button class="char-btn btn-jobless" onclick="selectCharacter('jobless.png')"></button>
                   <span class="eggname">Jobless</span>
                </div>
                <div class="egg-container">
                    <button class="char-btn btn-mj" onclick="selectCharacter('michaelJ.png')"></button>
                    <span class="eggname">MJ</span>
                </div>
                <div class="egg-container">
                    <button class="char-btn btn-princess" onclick="selectCharacter('princess.png')"></button>
                    <span class="eggname">Princess</span>
                </div>
                <div class="egg-container">
                    <button class="char-btn btn-magician" onclick="selectCharacter('magician.png')"></button>
                    <span class="eggname">Magician</span>
                </div>
                <div class="egg-container">
                    <button class="char-btn btn-cutie" onclick="selectCharacter('Cutie.png')"></button>
                    <span class="eggname">Cutie</span>
                </div>
            </div>
        </div>

        <div id="scoreboard">
            <div id="scoretext">Score: <span id="score">0</span></div>
            <div id="space" class="hidden">Press SPACE BAR to Jump!</div>
        </div>

        <div id="gameoverscreen" class="hiddenpopup">
            <h1 class="gameovertitle">GAME OVER!</h1>
            <p class="finalscore">Final Score: <span id="finalscore">0</span></p>
            <button class="restart" onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
